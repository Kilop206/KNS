name: AQM benchmark v1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

jobs:
  benchmark:
    name: Run AQM baseline v1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install KNS build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libgl1-mesa-dev xorg-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev extra-cmake-modules

      - name: Configure benchmark build
        run: cmake -S . -B build -DKNS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build KNS
        run: cmake --build build --config Release --parallel

      - name: Run official AQM baseline
        run: |
          python scripts/benchmark_suite.py \
            --suite benchmarks/v1/aqm-baseline.json \
            --exe build/app/KNS \
            --timeout 60 \
            --output "results/benchmarks/aqm-baseline-v1/${GITHUB_SHA}"

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          REPORT="results/benchmarks/aqm-baseline-v1/${GITHUB_SHA}/report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Benchmark report unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqm-baseline-v1-${{ github.sha }}
          path: results/benchmarks/aqm-baseline-v1/${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
