name: Release KNS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            artifact: kns-linux-amd64.tar.gz
          - name: windows-amd64
            os: windows-latest
            artifact: kns-windows-amd64.zip
          - name: macos-arm64
            os: macos-latest
            artifact: kns-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(sed -n 's/.*project(KNS VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$PROJECT_VERSION" ]; then
            echo "Could not read KNS project version from CMakeLists.txt" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match KNS project version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev extra-cmake-modules

      - name: Set up MSYS2 MinGW64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DKNS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Configure, build and test Windows with MinGW64
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DKNS_BUILD_TESTS=ON -DOPENSSL_ROOT_DIR=/mingw64
          cmake --build build-mingw --parallel 2
          ctest --test-dir build-mingw --output-on-failure

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/kns
          cp build/app/KNS dist/kns/
          cp -R build/app/assets dist/kns/assets
          cp -R build/app/topologies dist/kns/topologies
          cp README.md LICENSE dist/kns/
          tar -C dist -czf "dist/${{ matrix.artifact }}" kns
          (cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/kns | Out-Null
          Copy-Item build-mingw/app/KNS.exe dist/kns/KNS.exe
          Copy-Item build-mingw/app/assets dist/kns/assets -Recurse
          Copy-Item build-mingw/app/topologies dist/kns/topologies -Recurse
          Copy-Item README.md,LICENSE dist/kns/

      - name: Include MinGW64 runtime in Windows package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/kns/
          cp /mingw64/bin/libstdc++-6.dll dist/kns/
          cp /mingw64/bin/libwinpthread-1.dll dist/kns/

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/kns/* -DestinationPath "dist/${{ matrix.artifact }}"
          $hash = (Get-FileHash "dist/${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Set-Content "dist/${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
