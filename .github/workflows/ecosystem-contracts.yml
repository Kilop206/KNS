name: Ecosystem contract integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    branches: [ main ]
    paths:
      - "contracts/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/ecosystem-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Cross-repository contract smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KNS
        uses: actions/checkout@v4
        with:
          path: kns

      - name: Checkout KNS Discovery
        uses: actions/checkout@v4
        with:
          repository: Kilop206/KNS-Discovery
          ref: main
          path: discovery
          persist-credentials: false

      - name: Checkout Topology Hub
        uses: actions/checkout@v4
        with:
          repository: Kilop206/Topology-Hub
          ref: main
          path: topology-hub
          persist-credentials: false

      - name: Checkout Sentient KNS
        uses: actions/checkout@v4
        with:
          repository: Kilop206/sentient-KNS
          ref: main
          path: sentient
          persist-credentials: false

      - name: Checkout KiWi
        uses: actions/checkout@v4
        with:
          repository: Kilop206/KiWi
          ref: main
          path: kiwi
          persist-credentials: false

      - name: Validate canonical KNS schemas
        run: python kns/scripts/validate_contracts.py

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: discovery/go.mod
          cache: false

      - name: Validate Discovery topology producer
        working-directory: discovery
        run: go test ./internal/discovery

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            topology-hub/backend/pom.xml
            sentient/pom.xml

      - name: Validate Topology Hub topology boundary
        working-directory: topology-hub/backend
        run: mvn -B -ntp -Dtest=HubApiTest test

      - name: Validate Sentient chat boundary
        working-directory: sentient
        run: mvn -B -ntp -Dtest=ChatControllerTests test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kiwi/pyproject.toml

      - name: Install KiWi contract test dependencies
        working-directory: kiwi
        run: python -m pip install -e ".[test]"

      - name: Validate KiWi chat boundary
        working-directory: kiwi
        run: python -m unittest discover -s tests -p "test_chat.py" -v
