name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_tests: ON
          - os: macos-latest
            build_tests: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev extra-cmake-modules
      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DKNS_BUILD_TESTS=${{ matrix.build_tests }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: matrix.build_tests == 'ON'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate ecosystem contracts
        run: |
          python -m pip install -r scripts/requirements-contracts.txt
          python scripts/validate_contracts.py

      - name: Validate emitted analysis context
        run: python scripts/validate_analysis_context.py

      - name: Validate coordinated release train
        run: python scripts/validate_release_train.py

      - name: Run ecosystem release preflight
        run: python scripts/release_preflight.py --structural-only --json-output build/release-preflight.json --markdown-output build/release-preflight.md

      - name: Upload release preflight
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight
          path: |
            build/release-preflight.json
            build/release-preflight.md
          if-no-files-found: error

      - name: Validate benchmark suite
        run: python scripts/benchmark_suite.py --dry-run

  windows-mingw:
    name: Build and Test (Windows MinGW64/Ninja)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-python

      - name: Configure, build and test with MinGW64
        shell: msys2 {0}
        run: |
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DKNS_BUILD_TESTS=ON -DOPENSSL_ROOT_DIR=/mingw64
          cmake --build build-mingw --parallel 2
          ctest --test-dir build-mingw --output-on-failure

      - name: Stage MinGW64 runtime for native contract validation
        shell: msys2 {0}
        run: |
          cp /mingw64/bin/libgcc_s_seh-1.dll build-mingw/app/
          cp /mingw64/bin/libstdc++-6.dll build-mingw/app/
          cp /mingw64/bin/libwinpthread-1.dll build-mingw/app/
          cp /mingw64/bin/libssl-3-x64.dll build-mingw/app/
          cp /mingw64/bin/libcrypto-3-x64.dll build-mingw/app/

      - name: Set up Python for contract validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate contracts and emitted context
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-contracts.txt
          python scripts/validate_contracts.py
          python scripts/validate_analysis_context.py --work-dir build-mingw

  sanitizers:
    name: Sanitizers (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev extra-cmake-modules

      - name: Configure with sanitizers
        run: cmake -S . -B build-sanitizers -DKNS_BUILD_TESTS=ON -DKNS_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build (sanitizers)
        run: cmake --build build-sanitizers --config RelWithDebInfo --parallel 2

      - name: Test (sanitizers)
        run: ctest --test-dir build-sanitizers --output-on-failure

  warnings-as-errors:
    name: Warnings as Errors (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev extra-cmake-modules

      - name: Configure with warnings-as-errors
        run: cmake -S . -B build-werror -DKNS_BUILD_TESTS=ON -DKNS_WARNINGS_AS_ERRORS=ON -DKNS_ENABLE_WARNINGS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build (warnings-as-errors)
        run: cmake --build build-werror --config Release --parallel
